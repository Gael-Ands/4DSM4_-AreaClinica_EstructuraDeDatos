<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepción de pacientes</title>
    <link rel="stylesheet" href="style/estilos.css">
</head>

<body>

<div class="contenedor">

    <h1>Recepción de pacientes</h1>

    <div id="estadoServicio" class="resultado"></div>

    <h2>Verificación de paciente</h2>

    <label>Número de seguridad social:</label>
    <input type="text" id="numero" placeholder="Ingresa el NSS">

    <button type="button" id="btnBuscar">
        Verificar número
    </button>

    <button type="button" id="btnExpediente">
        Consultar expediente
    </button>

    <div id="encontrado" class="resultado oculto">
        <h3>Paciente registrado correctamente</h3>
        <p id="datosPaciente"></p>
    </div>

    <div id="noEncontrado" class="resultado oculto">
        <h3>Paciente no registrado</h3>
        <p>El número de seguridad social no se encuentra en el padrón.</p>

        <button type="button" id="btnRegistro">
            Registrar nuevo paciente
        </button>
    </div>

    <!-- Contenedor para mostrar el historial clínico (HU-A12) -->
    <div id="cajaExpediente" class="resultado oculto"></div>

    <hr>
    
    <form id="formAtencion">

        <h2>Datos de atención</h2>
        
        <label>NSS:</label>
        <input type="text" id="nss" readonly>
        
        <label>Nombre:</label>
        <input type="text" id="nombre" readonly>
        
        <label>Matrícula:</label>
        <input type="text" id="matricula" readonly>
        
        <label>Carrera:</label>
        <input type="text" id="carrera" readonly>
        
        <label>Estatus:</label>
        <input type="text" id="estatus" readonly>

        <label>Tipo de atención:</label>
        <select id="tipo">
            <option value="">Selecciona una opción</option>
            <option value="urgencias">Urgencias</option>
            <option value="consultas">Consultas</option>
            <option value="vacunacion">Vacunación</option>
        </select>

        <label>Altura (metros):</label>
        <input type="number" id="altura" step="0.01" min="0.01">

        <label>Peso (kg):</label>
        <input type="number" id="peso" step="0.1" min="0.1">

        <label>Tipo de sangre:</label>
        <select id="sangre">
            <option value="">Selecciona una opción</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="No sabe">No lo sabe</option>
        </select>

        <label>Descripción del motivo de atención:</label>
        <textarea id="descripcion" rows="4" placeholder="Escribe el motivo de atención..."></textarea>

        <button type="button" id="btnContinuar">
            Continuar a atención
        </button>
    
    </form>

</div>

<script src="scripts/config.js"></script>
<script src="scripts/buscar.js"></script>

</body>
</html>
